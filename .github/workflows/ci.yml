name: Verify app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: operation-instructions-demo-build
          path: dist/
          retention-days: 7
